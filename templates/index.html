<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEA PPE AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        .box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
        }

        img {
            max-width: 100%;
            margin-top: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>PEA PPE AI</h1>

    <p>ระบบตรวจสอบอุปกรณ์ PPE ด้วย AI</p>

    <form method="POST" enctype="multipart/form-data">

    <input
    type="file"
    name="image"
    accept="image/*"
    required
>

        <br>

        <button type="submit">
            ตรวจสอบ PPE
        </button>

    </form>

    {% if result_image %}
        <h2>ผลการตรวจสอบ</h2>

        <img src="{{ url_for('static', filename='static_result.jpg') }}">
    {% endif %}

</div>

</body>
</html>
