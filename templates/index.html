<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PEA PPE AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 20px;
        }

        .box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            margin-bottom: 10px;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            margin: 20px 0;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        img {
            max-width: 100%;
            margin-top: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>PEA PPE AI</h1>

    <p>ระบบตรวจสอบอุปกรณ์ PPE ด้วย AI</p>

    <form action="/" method="POST" enctype="multipart/form-data">

        <input
            type="file"
            id="image"
            name="image"
            accept="image/*"
            required
        >

        <button type="submit">
            🔍 ตรวจสอบ PPE
        </button>

    </form>

    {% if result_image %}
        <h2>ผลการตรวจสอบ</h2>

        <img
            src="{{ url_for('static', filename=result_image) }}"
            alt="ผลการตรวจสอบ PPE"
        >
    {% endif %}

</div>

</body>
</html>
